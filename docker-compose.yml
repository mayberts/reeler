services:
  reeler:
    # Built and published by .github/workflows/docker-publish.yml on every push to
    # main. Use `docker compose pull && docker compose up -d` to update — no build
    # step needed on the Unraid box itself. Swap back to `build: .` (git URL context
    # or a local clone) if you'd rather build from source instead.
    image: ghcr.io/mayberts/reeler:latest
    container_name: reeler
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      # Lives inside the /config volume so it persists across container recreation.
      - DATABASE_URL=/config/reeler.db
      - PLEX_SERVER_URL=${PLEX_SERVER_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_WEBHOOK_TOKEN=${PLEX_WEBHOOK_TOKEN}
      - PLEX_CLIENT_IDENTIFIER=${PLEX_CLIENT_IDENTIFIER}
      # Optional — leave the .env value blank to disable manual/non-Plex logging.
      - TMDB_API_KEY=${TMDB_API_KEY}
    volumes:
      # On Unraid, point this at an appdata path, e.g. /mnt/user/appdata/reeler:/config
      - ./config:/config
